# Workday Job Alert — company config
#
# HOW TO FIND YOUR VALUES:
# Open a company's Workday careers page in your browser, e.g.:
#   https://nike.wd1.myworkdayjobs.com/nke
#
# Break that URL down:
#   https://{tenant}.{wd_host}/{site}
#            nike     wd1.myworkdayjobs.com   nke
#
#   tenant      -> "nike"
#   wd_host     -> "wd1.myworkdayjobs.com"   (could be wd1, wd3, wd5, wd12, etc.)
#   site        -> "nke"                     (exact case matters, and is often
#                                              NOT the obvious human-readable name!)
#
# IMPORTANT: site slugs are not guessable from the company name (see Nike's
# "nke" and PayPal's "jobs" below) and they occasionally change (Qualcomm
# moved its whole career site off Workday's wd5 host in 2024). Always
# confirm the real value yourself before trusting a company block:
#   1. Open the company's careers page in a browser
#   2. Open DevTools -> Network tab, filter for "jobs"
#   3. Reload / search -> look for a POST to .../wday/cxs/{tenant}/{site}/jobs
#   4. That URL gives you the exact tenant/wd_host/site to use
#
# "keywords" — only alert on postings whose title contains at least one of
# these (case-insensitive). Leave empty / [] to alert on every new posting.

role_keywords: &role_keywords
  # Software Engineering
  - "software engineer"
  - "software developer"
  - "swe"
  - "backend engineer"
  - "backend developer"
  - "frontend engineer"
  - "frontend developer"
  - "front-end developer"
  - "front end developer"
  - "web developer"
  - "web engineer"
  - "full stack"
  - "full-stack"
  # Python / SQL
  - "python developer"
  - "python engineer"
  - "sql developer"
  # Data
  - "data engineer"
  - "data analyst"
  - "data scientist"
  - "data science"
  # AI / ML
  - "machine learning"
  - "artificial intelligence"
  - "ai engineer"
  - "ml engineer"
  # Cybersecurity
  - "cybersecurity"
  - "cyber security"
  - "information security"
  - "security engineer"
  - "security analyst"
  # General IT
  - "information technology"
  - "it analyst"
  - "it support"
  - "systems engineer"
  - "systems analyst"
  # Internships (full-time roles are already covered by the terms above)
  - "intern"
  - "internship"
  - "co-op"
  # Entry-level / new grad (distinct from internships — these are
  # full-time roles aimed at recent graduates, which "intern" alone
  # doesn't catch)
  - "entry level"
  - "entry-level"
  - "new grad"
  - "new graduate"
  - "early career"
  - "junior developer"
  - "junior engineer"
  - "junior software"
  - "graduate program"
  - "graduate engineer"
  - "associate software engineer"
  - "associate developer"
  - "associate engineer"

