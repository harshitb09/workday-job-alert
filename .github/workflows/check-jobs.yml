name: Check Workday Jobs

on:
  schedule:
    # every 5 minutes — roughly the practical floor GitHub Actions honors
    # reliably (it can lag a few extra minutes under platform load, this
    # isn't a hard real-time guarantee, just the closest cron gets you).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send one synthetic test message to Discord instead of a real check (verifies the webhook works)"
        required: false
        default: "false"
        type: boolean
      backfill_mode:
        description: "Surface all currently-open postings matching your filters, not just new-since-tracking ones (safe to re-run — won't double-alert)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python poll_workday.py --test
          elif [ "${{ github.event.inputs.backfill_mode }}" = "true" ]; then
            python poll_workday.py --backfill
          else
            python poll_workday.py
          fi

      - name: Commit updated state
        if: ${{ github.event.inputs.test_mode != 'true' }}
        run: |
          git config user.name "workday-job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json backfilled_jobs.json
          git diff --quiet --cached || git commit -m "Update tracking state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
