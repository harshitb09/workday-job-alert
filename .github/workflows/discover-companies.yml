name: Discover Workday Companies

# Manual only — this makes hundreds of HTTP requests (candidates x hosts x
# site-slug patterns), so it's not meant to run on a schedule.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scan the first N candidates (leave blank for all)"
        required: false
        default: ""
      auto_merge:
        description: "Automatically merge confirmed companies into config.yaml"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python discover_workday.py --limit ${{ github.event.inputs.limit }}
          else
            python discover_workday.py
          fi

      - name: Show results summary
        run: cat discovered_companies.yaml

      - name: Merge confirmed companies into config.yaml
        if: ${{ github.event.inputs.auto_merge == 'true' }}
        run: python merge_discovered.py

      - name: Commit results
        run: |
          git config user.name "workday-job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add discovered_companies.yaml config.yaml
          git diff --quiet --cached || git commit -m "Discover Workday companies [skip ci]"
          # This run can take several minutes, during which the scheduled
          # "Check Workday Jobs" workflow may have already pushed its own
          # commit (updating seen_jobs.json) — pull --rebase avoids a
          # rejected push in that race, retrying a couple times since a
          # second collision is possible but unlikely.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
