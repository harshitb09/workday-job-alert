name: Discover Workday Companies

# Runs automatically once a week (Workday tenants/slugs don't change often,
# so this doesn't need to be frequent) plus available for manual runs
# anytime from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scan the first N candidates (leave blank for all)"
        required: false
        default: ""
      auto_merge:
        description: "Automatically merge confirmed companies into config.yaml"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python discover_workday.py --limit ${{ github.event.inputs.limit }}
          else
            python discover_workday.py
          fi

      - name: Show results summary
        run: cat discovered_companies.yaml

      # Auto-merge on scheduled runs by default (no one's there to check a
      # box), and respects the manual dispatch input when triggered by hand.
      - name: Merge confirmed companies into config.yaml
        if: ${{ github.event_name == 'schedule' || github.event.inputs.auto_merge == 'true' }}
        run: python merge_discovered.py

      # Immediately surface currently-open matching postings for any
      # newly-added company — without this, a company added today would
      # stay silent until it happens to post something brand new, the
      # same "invisible backlog" problem we hit with Visa/Salesforce.
      # Safe to run every time: it tracks its own state and only alerts
      # on jobs it hasn't already surfaced.
      - name: Backfill currently-open postings for newly discovered companies
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python poll_workday.py --backfill

      - name: Commit results
        run: |
          git config user.name "workday-job-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          cp discovered_companies.yaml /tmp/discovered_companies.yaml.new 2>/dev/null || true
          cp config.yaml /tmp/config.yaml.new 2>/dev/null || true
          cp backfilled_jobs.json /tmp/backfilled_jobs.json.new 2>/dev/null || true

          success=false
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/discovered_companies.yaml.new discovered_companies.yaml 2>/dev/null || true
            cp /tmp/config.yaml.new config.yaml 2>/dev/null || true
            cp /tmp/backfilled_jobs.json.new backfilled_jobs.json 2>/dev/null || true

            git add discovered_companies.yaml config.yaml backfilled_jobs.json
            if git diff --quiet --cached; then
              echo "No changes to commit."
              success=true
              break
            fi

            git commit -m "Discover Workday companies [skip ci]"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "::error::Failed to push after 3 attempts."
            exit 1
          fi
