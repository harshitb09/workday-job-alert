# Candidate companies for Workday discovery.
#
# This is a list of well-known, large employers with documented visa
# sponsorship history (H-1B/OPT/CPT), spanning tech, finance, pharma,
# healthcare, industrials, and consulting. NOT all of these use Workday
# for their public career site — many use Greenhouse, Lever, iCIMS,
# SuccessFactors, Taleo, or a custom ATS instead.
#
# `discover_workday.py` reads this file and tests each `tenant` guess
# against real Workday hosts/site-slug patterns to find out which ones
# are actually live. Only entries it confirms get written to
# discovered_companies.yaml — nothing here is added to config.yaml
# automatically or blindly.
#
# tenant: best-guess slug (usually lowercase company name, no spaces/punctuation)
# name: display name for Discord alerts / config.yaml

